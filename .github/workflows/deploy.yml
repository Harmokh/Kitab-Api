name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }} # Optional, default is 22
          script: |
            # Navigate to the app directory
            cd /path/to/your/app # <--- UPDATE THIS TO YOUR ACTUAL SERVER PATH
            
            # Pull latest changes
            git pull origin main
            
            # Install dependencies
            npm install --production
            
            # Restart application (assuming PM2)
            # If you are not using PM2, replace this with your restart command
            pm2 reload ecosystem.config.js || pm2 restart all
